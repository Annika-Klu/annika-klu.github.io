profile:
  en: >
    Full-stack developer with a strong focus on data. After studying
    anthropology and working in public administration, I retrained as a
    developer in 2020. Since then I have built web applications with Vue and React,
    written SQL for APIs and reporting, and developed data
    pipelines and tooling in a data warehouse team. I am most at home beneath
    the surface – databases, APIs and automation – while an eye for design
    helps me on the frontend.
  de: >
    Full-Stack-Softwareentwickler mit ausgeprägtem Fokus auf Daten. Nach meinem
    Ethnologie-Studium und einigen Jahren in der öffentlichen Verwaltung bin ich
    2020 in die Softwareentwicklung gewechselt. Seitdem habe ich Webanwendungen
    mit Vue und React entwickelt, SQL für APIs und Reporting
    geschrieben sowie im Data-Warehouse-Team Datenpipelines und Tools für deren
    Betrieb gebaut. Am wohlsten fühle ich mich unter der Oberfläche – bei
    Datenbanken, APIs und Automatisierung. Mein Blick für Design kommt mir
    dabei im Frontend zugute.

