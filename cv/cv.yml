#
# Conventions
# - Text is either a plain string (same in every language) or a map with one
#   entry per language: { en: ..., de: ... }
# - Prose fields (profile, role, note, body, items) are Typst markup:
#   _italic_, *bold*. Escape literal _ * # @ $ with a backslash.
# - Dates are quoted "YYYY-MM" or "YYYY". Use "present" for ongoing entries.
#   Omit `from` to render "until <to>", omit `to` for a single date.
# - List items are plain text, or { text: ..., from/to: ... } to show a date
#   next to that item.

